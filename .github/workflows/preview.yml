# 临时预览部署（Arena 会话分支专用）
#
# 为什么需要它：Pages 的正式部署走 pages.yml（push: main / workflow_dispatch），
# 而本会话只有 arena/74dacbff-year-of-z 这一条分支可写、workflow_dispatch 又被
# App 令牌挡住。所以改成"push 到本分支即部署"，好处是不用动 main 就能拿到
# 一个可玩的线上地址。
#
# 用完即可删除：删掉本文件后，Pages 上的内容会一直保留到下一次 main 部署
# （合并 PR #8 时 pages.yml 会用同样的内容覆盖一次，结果一致）。
name: Preview deploy (session branch)

on:
  push:
    branches: ['arena/74dacbff-year-of-z']

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
