name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build   # 含 tsc --noEmit 类型检查
      # vitest：失败时把尾部输出接到注解上（日志下载常受限，注解在 API 里始终可读）
      - name: Run tests
        run: |
          set +e
          npm test > test.log 2>&1
          STATUS=$?
          set -e
          cat test.log
          if [ $STATUS -ne 0 ]; then
            echo "::error title=vitest-tail::$(tail -c 2500 test.log | tr '\n' '~')"
          fi
          exit $STATUS

  e2e:
    needs: check
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run build
      # YZ-14：验收跑生产构建（vite preview），不再验开发模式
      - name: Serve production build and run verify
        env:
          VERIFY_URL: http://127.0.0.1:4173/
        run: |
          npx vite preview --host 0.0.0.0 --port 4173 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/ > /dev/null && break
            sleep 1
          done
          set +e
          npm run verify > verify.log 2>&1
          STATUS=$?
          set -e
          cat verify.log
          if [ $STATUS -ne 0 ]; then
            echo "::error title=verify-tail::$(tail -c 3000 verify.log | tr '\n' '~')"
          fi
          kill "$SERVER_PID" 2>/dev/null || true
          exit $STATUS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: shots/
